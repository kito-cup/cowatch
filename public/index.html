<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoWatch — смотрите вместе</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="landing">
    <div class="landing-card">
      <img class="logo-img" src="/logo.png" alt="CoWatch" />
      <p class="tagline">Самое приятное место, где двое смотрят видео вместе</p>

      <input id="name" class="name-input" maxlength="24"
             placeholder="Ваше имя" autocomplete="off" />
      <button id="pair" class="btn-primary">💜 Наша комната</button>
      <button id="create" class="btn-primary" style="margin-top:10px;background:var(--surface);border:1px solid var(--border);box-shadow:none">Новая комната</button>

      <p class="hint" id="hint">«Наша комната» — постоянная: одна и та же ссылка<br />каждый вечер, статистика копится.</p>
    </div>
  </main>

  <script>
    const nameEl = document.getElementById("name");
    nameEl.value = localStorage.getItem("cw:name") || "";

    // бесплатный сервер засыпает без посетителей — честно показываем пробуждение
    async function wakingFetch(url, opts) {
      const slowTimer = setTimeout(() => {
        document.getElementById("hint").textContent =
          "Сервер просыпается, это займёт до минуты…";
      }, 2500);
      try { return await fetch(url, opts); }
      finally { clearTimeout(slowTimer); }
    }

    document.getElementById("create").addEventListener("click", async () => {
      const name = nameEl.value.trim() || "Гость";
      localStorage.setItem("cw:name", name);
      const res = await wakingFetch("/api/rooms", { method: "POST" });
      const { id } = await res.json();
      location.href = `/r/${id}`;
    });

    // Постоянная комната пары: id создаётся один раз и живёт в localStorage.
    // Если сервер перезапускался, комната воссоздастся с тем же id при входе.
    document.getElementById("pair").addEventListener("click", async () => {
      const name = nameEl.value.trim() || "Гость";
      localStorage.setItem("cw:name", name);
      let id = localStorage.getItem("cw:pairRoom");
      if (!id) {
        const res = await wakingFetch("/api/rooms", { method: "POST" });
        id = (await res.json()).id;
        localStorage.setItem("cw:pairRoom", id);
      }
      location.href = `/r/${id}`;
    });

    nameEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("create").click();
    });
  </script>
</body>
</html>
